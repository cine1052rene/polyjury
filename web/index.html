<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factdunit — mysteries solved by today's real facts</title>
  <meta name="description" content="A daily detective game where fictional cases are cracked by real-world facts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b3261e'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23f3ecdf' font-family='Courier New,monospace'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">F</span>
      <div>
        <h1>Factdunit</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="top-actions">
      <nav id="city-tabs" class="city-tabs" aria-label="City"></nav>
      <button id="lang-toggle" class="ghost" type="button">한국어</button>
    </div>
  </header>

  <main class="layout">
    <section class="casefile" aria-labelledby="case-title">
      <div class="stamp" data-i18n="caseFile"></div>
      <p class="case-meta" id="case-meta"></p>
      <h2 id="case-title" class="case-title"></h2>
      <p id="case-setup" class="case-setup"></p>
      <p id="case-brief" class="case-brief"></p>

      <h3 class="section-label" data-i18n="suspects"></h3>
      <div id="suspects" class="suspects" role="radiogroup"></div>

      <div class="evidence-slot" id="evidence-slot">
        <h3 class="section-label" data-i18n="yourEvidence"></h3>
        <p id="evidence-empty" class="muted" data-i18n="noEvidence"></p>
        <div id="evidence-card" class="evidence-card" hidden></div>
      </div>

      <button id="accuse-btn" class="primary" type="button" disabled data-i18n="accuse"></button>
      <p id="accuse-hint" class="muted small" data-i18n="accuseHint"></p>
    </section>

    <section class="investigation" aria-labelledby="investigate-title">
      <h2 id="investigate-title" class="panel-title" data-i18n="investigate"></h2>
      <p class="muted small" data-i18n="investigateHint"></p>
      <form id="search-form" class="search-form">
        <input id="search-input" type="search" autocomplete="off" required minlength="2" maxlength="200">
        <button class="primary" type="submit" data-i18n="search"></button>
      </form>
      <p id="search-status" class="muted small" aria-live="polite"></p>
      <ol id="results" class="results"></ol>
    </section>

    <section id="verdict" class="verdict" hidden aria-live="polite"></section>
  </main>

  <footer class="footer">
    <details>
      <summary data-i18n="howItWorks"></summary>
      <p data-i18n="howItWorksBody"></p>
    </details>
    <p class="muted small" data-i18n="groundRules"></p>
  </footer>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
